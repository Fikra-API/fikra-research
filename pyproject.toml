[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fikra-research"
version = "0.1.0"
description = "Fikra Research: open, reproducible systems work. Phase 1 - Inkling 2 Mini on T4 and L4."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Fikra Research" }]
dependencies = []

[project.optional-dependencies]
bench = ["torch>=2.3", "transformers>=4.44", "accelerate>=0.30"]

[tool.hatch.build.targets.wheel]
packages = ["fikra"]

[tool.pytest.ini_options]
testpaths = ["tests"]
